<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>היסטוריה 17.11 · מבית לאומי למדינה בדרך</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0E1014; --s1:#161921; --s2:#1E222C; --s3:#272C38; --line:#2C3240;
  --tx:#EDE8DE; --mu:#9BA1AC; --acc:#E3B04B; --acc2:#F1CD7E; --on-acc:#1A1408;
  --ok:#4FBF8A; --bad:#E5675C; --warn:#E8A23C; --info:#6FA8E8;
  --r:16px; --r2:12px;
  --h1:clamp(26px,7vw,34px); --h2:20px; --h3:17px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.55}
body{min-height:100vh;overscroll-behavior-y:none}
.serif{font-family:"Frank Ruhl Libre",Georgia,serif}
b{color:#fff;font-weight:600}
a{color:var(--acc2)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{max-width:560px;margin:0 auto;padding:16px 16px calc(96px + var(--safe-b))}
h1,h2,h3{margin:0;font-family:"Frank Ruhl Libre",Georgia,serif;font-weight:700;line-height:1.25}
h1{font-size:var(--h1)} h2{font-size:var(--h2)} h3{font-size:var(--h3)}
.mu{color:var(--mu)} .sm{font-size:14px} .xs{font-size:12.5px}
.row{display:flex;align-items:center;gap:10px} .sp{flex:1}
.stack>*+*{margin-top:12px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.tight{padding:12px 14px}
.sec{margin-top:22px}
.sec>.lbl{font-size:13px;color:var(--mu);letter-spacing:.02em;margin:0 2px 8px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:40px}
.back{width:40px;height:40px;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
.top h2{flex:1}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:20px 18px 18px;background:
 radial-gradient(120% 90% at 100% 0%,#2a2416 0%,transparent 55%),
 linear-gradient(160deg,#1b1f29,#12151c);border:1px solid #33302a}
.hero .kick{font-size:13px;color:var(--acc2);letter-spacing:.04em}
.hero h1{margin-top:4px}
.cd{display:flex;gap:8px;margin-top:14px}
.cd div{flex:1;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px 4px;text-align:center}
.cd b{display:block;font-size:24px;font-family:"Frank Ruhl Libre",Georgia,serif}
.cd span{font-size:12px;color:var(--mu)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:13.5px;font-weight:500;border:1px solid}
.chip.ok{color:var(--ok);border-color:rgba(79,191,138,.4);background:rgba(79,191,138,.08)}
.chip.bad{color:var(--bad);border-color:rgba(229,103,92,.45);background:rgba(229,103,92,.08)}
.chip.warn{color:var(--warn);border-color:rgba(232,162,60,.4);background:rgba(232,162,60,.08)}
.chip.info{color:var(--info);border-color:rgba(111,168,232,.4);background:rgba(111,168,232,.08)}
.ring{width:64px;height:64px;flex:none}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:14px;padding:12px 16px;font-weight:600;font-size:16.5px}
.btn.pri{background:var(--acc);color:var(--on-acc)}
.btn.pri:active{background:var(--acc2)}
.btn.sec2{background:var(--s2);border:1px solid var(--line)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mu)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btns{display:flex;gap:10px}.btns .btn{flex:1}

/* plan */
.day{padding:0;overflow:hidden}
.day-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.day-h .d{font-size:12.5px;color:var(--mu)}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:13px 16px;border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.step .ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--s3);flex:none;display:grid;place-items:center;font-size:14px}
.step.done .ck{background:var(--ok);border-color:var(--ok);color:#0b1a12}
.step.done .st{color:var(--mu);text-decoration:line-through;text-decoration-color:rgba(255,255,255,.25)}
.step .min{font-size:12.5px;color:var(--mu);white-space:nowrap}
.step .go{color:var(--mu);font-size:18px}
.day.past .day-h{opacity:.75}
.day.today{border-color:#4a3f26}
.day.today .day-h{background:rgba(227,176,75,.06)}

/* topic bars */
.tbar{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tbar:last-child{border-bottom:0}
.bar{height:8px;border-radius:99px;background:var(--s3);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--mu);transition:width .5s}
.bar i.lo{background:var(--bad)} .bar i.md{background:var(--warn)} .bar i.hi{background:var(--ok)}
.pct{font-size:14px;font-weight:600;min-width:42px;text-align:left}

/* tiles */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:right;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.tile .ic{font-size:22px}
.tile .tt{font-weight:600;margin-top:6px}
.tile .ss{font-size:12.5px;color:var(--mu)}

/* exam split */
.split{display:flex;height:34px;border-radius:10px;overflow:hidden;margin-top:10px;font-size:13px;font-weight:600}
.split div{display:grid;place-items:center}
.split .a{flex:64;background:#2b3242;color:#cfd7e6}.split .b{flex:36;background:#3d3420;color:var(--acc2)}

/* learn cards */
.lcard{min-height:52vh;display:flex;flex-direction:column}
.lcard h2{margin-bottom:12px}
.lcard ul{margin:0;padding:0;list-style:none}
.lcard li{padding:9px 0;border-bottom:1px dashed var(--line);font-size:16px}
.lcard li:last-child{border-bottom:0}
.key{margin-top:auto;padding:12px 14px;border-radius:12px;background:rgba(227,176,75,.08);border:1px solid rgba(227,176,75,.25);font-size:15px}
.key::before{content:"לזכור";display:block;font-size:12px;color:var(--acc2);margin-bottom:2px}
.dots{display:flex;gap:5px;justify-content:center;margin:12px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--s3)}
.dots i.on{background:var(--acc);width:18px;border-radius:9px}
.dots i.seen{background:#6b6450}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.prog{flex:1;height:6px;background:var(--s3);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
.tag{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--s2);color:var(--mu);border:1px solid var(--line)}
.tag.f{color:#cdb98a;border-color:#4a4230}
.qtext{font-size:18px;font-weight:500;line-height:1.5;margin:6px 0 14px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;padding:13px 14px;border-radius:12px;background:var(--s2);border:1.5px solid var(--line);margin-bottom:9px;font-size:16px;line-height:1.45}
.opt .l{flex:none;width:24px;height:24px;border-radius:7px;background:var(--s3);display:grid;place-items:center;font-size:13px;font-weight:600}
.opt.sel{border-color:var(--acc);background:#2a2618}
.opt.sel .l{background:var(--acc);color:var(--on-acc)}
.opt.right{border-color:var(--ok);background:rgba(79,191,138,.1)}
.opt.wrong{border-color:var(--bad);background:rgba(229,103,92,.1)}
.opt[disabled]{pointer-events:none}
.tfrow{display:flex;gap:10px}.tfrow .opt{justify-content:center;font-weight:600}
.fb{margin-top:12px;padding:13px 14px;border-radius:12px;font-size:15.5px}
.fb.ok{background:rgba(79,191,138,.1);border:1px solid rgba(79,191,138,.35)}
.fb.bad{background:rgba(229,103,92,.09);border:1px solid rgba(229,103,92,.35)}
.fb .h{font-weight:700;margin-bottom:3px}
.mrow{padding:10px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .lt{font-weight:500;margin-bottom:6px}
select{width:100%;min-height:46px;border-radius:10px;background:var(--s2);color:var(--tx);border:1.5px solid var(--line);padding:8px 10px;font:inherit;font-size:15px}
select.right{border-color:var(--ok)} select.wrong{border-color:var(--bad)}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{padding:8px 12px;border-radius:10px;background:var(--s2);border:1.5px solid var(--line);font-size:14px}
.seg.sel{border-color:var(--acc);background:#2a2618}
.seg.right{border-color:var(--ok)}.seg.wrong{border-color:var(--bad)}
.cloze{font-size:17px;line-height:2.1}
.cloze select{display:inline-block;width:auto;min-width:110px;min-height:38px;padding:4px 8px;margin:0 3px;vertical-align:middle}
.ordl .opt .l{background:var(--s3)}
.picked{counter-reset:p}
textarea{width:100%;min-height:220px;border-radius:12px;background:var(--s2);color:var(--tx);border:1.5px solid var(--line);padding:12px;font:inherit;font-size:16px;line-height:1.6;resize:vertical}
.pt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:right;padding:11px 12px;border-radius:12px;background:var(--s2);border:1.5px solid var(--line);margin-bottom:8px}
.pt .ck{width:24px;height:24px;border-radius:7px;border:2px solid var(--s3);flex:none;display:grid;place-items:center;font-size:13px}
.pt.on{border-color:rgba(79,191,138,.5)} .pt.on .ck{background:var(--ok);border-color:var(--ok);color:#0b1a12}
.pt .w{margin-inline-start:auto;font-size:13px;color:var(--mu);white-space:nowrap}
.model{background:#151a14;border:1px solid #2c3a2c;border-radius:12px;padding:14px;font-size:15.5px}
.score{font-family:"Frank Ruhl Libre",Georgia,serif;font-size:44px;font-weight:700;line-height:1}
details summary{cursor:pointer;color:var(--acc2);font-weight:500;padding:6px 0}
.tl{display:grid;grid-template-columns:118px 1fr;gap:4px 12px;font-size:15px}
.tl .y{color:var(--acc2);font-weight:600;font-size:14px}
.tl>div{padding:6px 0;border-bottom:1px solid var(--line)}
.timer{font-variant-numeric:tabular-nums;font-weight:700;padding:4px 10px;border-radius:9px;background:var(--s2);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:rgba(229,103,92,.5)}

/* nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(14,16,20,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:flex;max-width:560px;width:100%}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--mu);border-radius:10px;min-height:52px}
nav.tabs button .i{font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.7}
nav.tabs button.on{color:var(--acc2)}
nav.tabs button.on .i{filter:none;opacity:1}

.fade{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bar i,.prog i{transition:none}}
@media (min-width:700px){#app{padding-top:28px}}
</style>

</div></nav>
<noscript><p style="padding:20px">צריך להפעיל JavaScript כדי להשתמש בכלי.</p></noscript>
<script>/* כל התוכן של הכלי. עובדות נבדקו מול מקורות (רשימה ב-SOURCES בסוף). */
const TOPICS = {
  A: {name:`המדיניות הבריטית`, short:`בריטים`, icon:`⚖️`, weight:`~25%`},
  B: {name:`הסכסוך היהודי-ערבי`, short:`סכסוך`, icon:`🔥`, weight:`~30%`},
  C: {name:`התיישבות בעיר ובכפר`, short:`התיישבות`, icon:`🌾`, weight:`~30%`},
  D: {name:`מוסדות היישוב`, short:`מוסדות`, icon:`🏛️`, weight:`~15%`},
  M: {name:`איך עונים במבחן`, short:`שיטה`, icon:`✍️`, weight:``}
};

/* ---------- כרטיסי לימוד ---------- */
const CARDS = {
M:[
{t:`איך עונים על שאלה פתוחה (18 נק')`, b:[
`<b>1. מסמנים את הפועל:</b> הצג = לכתוב עובדות. הסבר = למה / מה הקשר (סיבה ותוצאה). תאר = מה קרה, לפי הסדר. השווה = מה דומה ומה שונה.`,
`<b>2. סופרים כמה מבקשים:</b> "שני גורמים" = שתי פסקאות נפרדות, אחת לכל גורם.`,
`<b>3. כל פסקה בנויה כך:</b> מושג ← עובדה (שנה, שם, מספר) ← הסבר עם "משום ש..." או "ולכן...".`,
`<b>4. אורך:</b> בערך 8–12 שורות לשאלה. לא חיבור, אבל גם לא שורה אחת.`],
k:`הבודק מחפש: מושג נכון + דוגמה + הסבר. בלי הסבר מקבלים חצי.`},
{t:`ניהול הזמן ב-90 דקות`, b:[
`<b>8 אמריקאיות:</b> בערך 3–4 דקות לכל אחת, כ-30 דקות. לא נתקעים: מסמנים ומדלגים.`,
`<b>2 פתוחות:</b> כ-20 דקות לכל אחת. קודם כותבים בצד 3–4 מילות מפתח, ורק אז עונים.`,
`<b>10 דקות אחרונות:</b> חוזרים לשאלות שדילגת עליהן ובודקים שענית על כל חלק.`,
`<b>באמריקאיות:</b> קודם פוסלים 2 תשובות שבטוח שגויות. מילים כמו "רק", "תמיד", "לגמרי" הן בדרך כלל סימן לתשובה שגויה.`],
k:`פתוחה אחת = 18 נקודות = יותר משתי אמריקאיות. לא משאירים פתוחה ריקה, גם חצי תשובה שווה נקודות.`}
],
A:[
{t:`מה זה מנדט?`, b:[
`אחרי מלחמת העולם הראשונה <b>חבר הלאומים</b> חילק את שטחי האימפריה העות'מאנית למעצמות כ"מנדט": ייפוי כוח <b>זמני</b> לנהל שטח ולהכין אותו לעצמאות. לא שלטון לתמיד.`,
`<b>אפריל 1920, ועידת סן רמו:</b> בריטניה מקבלת את המנדט על ארץ ישראל.`,
`<b>1 ביולי 1920:</b> השלטון הצבאי מתחלף בשלטון אזרחי. בראשו <b>הנציב העליון</b> הראשון, <b>הרברט סמואל</b>, יהודי וציוני.`,
`<b>24 ביולי 1922:</b> חבר הלאומים מאשר את "טופס המנדט". הוא נכנס לתוקף בספטמבר 1923.`],
k:`המנדט נתן להצהרת בלפור תוקף משפטי בינלאומי. מהבטחה של בריטניה היא הפכה להתחייבות מול העולם.`},
{t:`טופס המנדט: מה קיבלו היהודים`, b:[
`<b>בפתיחה:</b> הצהרת בלפור, והכרה ב<b>קשר ההיסטורי</b> של העם היהודי לארץ.`,
`<b>סעיף 2:</b> בריטניה תיצור תנאים להקמת הבית הלאומי ולמוסדות שלטון עצמי.`,
`<b>סעיף 4:</b> הכרה ב<b>"סוכנות יהודית"</b> שתייעץ ותשתף פעולה עם הממשל (עד 1929 מילאה את התפקיד ההנהלה הציונית).`,
`<b>סעיף 6:</b> לעודד <b>עלייה</b> והתיישבות צפופה של יהודים <b>על הקרקע</b>.`,
`<b>סעיף 22:</b> <b>עברית</b> שפה רשמית, לצד אנגלית וערבית.`],
k:`לתנועה הציונית זה היה ה"צ'רטר" שהרצל חלם עליו: אישור בינלאומי לבית לאומי.`},
{t:`טופס המנדט: מה הובטח לערבים, וההתחייבות הכפולה`, b:[
`שמירה על <b>זכויות ומעמד</b> שאר האוכלוסייה (סעיף 6), זכויות אזרח ודת לכולם בלי קשר לדת או גזע (סעיף 2).`,
`חופש פולחן, שמירה על המקומות הקדושים, <b>ערבית</b> שפה רשמית.`,
`<b>סעיף 25:</b> בריטניה רשאית לא להחיל את סעיפי הבית הלאומי ממזרח לירדן. כך נוצרה <b>עבר הירדן</b> בשלטון עבדאללה מהמשפחה ההאשמית.`,
`<b>ההתחייבות הכפולה:</b> בריטניה הבטיחה גם לבנות בית לאומי ליהודים וגם לא לפגוע בערבים. מכאן כל המתח בהמשך.`],
k:`כשיש מאורעות, בריטניה נוטה לצד "לא לפגוע בערבים", כדי להרגיע.`},
{t:`הדפוס החוזר: מאורעות ← ועדה ← ספר לבן`, b:[
`<b>1921:</b> מאורעות תרפ"א ← <b>ועדת הייקרפט</b> ← <b>הספר הלבן הראשון</b> (צ'רצ'יל, 1922).`,
`<b>1929:</b> מאורעות תרפ"ט ← <b>ועדת שאו</b> (1930) ← <b>הופ-סימפסון</b> (1930) ← <b>הספר הלבן השני</b> (פספילד, 1930).`,
`<b>ספר לבן</b> = מסמך מדיניות רשמי שהממשלה הבריטית מציגה לפרלמנט.`,
`בכל פעם המסקנה דומה: הערבים חוששים מהעלייה ומרכישת הקרקעות, ולכן מגבילים את היהודים.`],
k:`במבחן: אם שואלים על ועדה, תמיד לכתוב מה גרם לה (אילו מאורעות) ומה יצא ממנה (איזה ספר לבן).`},
{t:`הוועדות: מה כל אחת קבעה`, b:[
`<b>ועדת הייקרפט (1921):</b> הניצוץ היה תהלוכת הקומוניסטים ב-1 במאי. הסיבה העמוקה: עוינות של הערבים כלפי היהודים בגלל <b>העלייה</b> ובגלל איך שהם הבינו את <b>המדיניות הציונית</b>.`,
`<b>ועדת שאו (מרץ 1930):</b> הסיבה העמוקה למאורעות 1929 היא פחד הערבים מ<b>העלייה</b> ומ<b>רכישת קרקעות</b>, ונוצר מעמד של ערבים בלי אדמה. המליצה לבדוק את נושאי העלייה והקרקעות.`,
`<b>הופ-סימפסון (1930):</b> יש פחות אדמה לעיבוד ממה שחשבו. "אין עודף קרקע" להתיישבות עולים חדשים. לכן להגביל עלייה והתיישבות.`],
k:`הייקרפט ← ספר לבן 1. שאו + הופ-סימפסון ← ספר לבן 2.`},
{t:`הספר הלבן הראשון, 1922 (צ'רצ'יל)`, b:[
`<b>למה:</b> בעקבות מאורעות תרפ"א ומסקנות ועדת הייקרפט, ולפני אישור המנדט.`,
`<b>מה טוב ליהודים:</b> בריטניה עומדת מאחורי הצהרת בלפור. היהודים בארץ "מכוח זכות ולא מחסד".`,
`<b>מה מגביל:</b> הבית הלאומי יקום "<b>בארץ ישראל</b>", לא שכל הארץ תהיה יהודית. העלייה לפי <b>כושר הקליטה הכלכלי</b> של הארץ. <b>עבר הירדן מנותק</b> מהבית הלאומי. הצעה ל<b>מועצה מחוקקת</b>.`,
`<b>תגובות:</b> התנועה הציונית קיבלה באכזבה (כדי שהמנדט יאושר). הערבים דחו אותו.`],
k:`כושר קליטה כלכלי = נכנסים רק כמה עולים שהכלכלה יכולה לקלוט. בפועל הוא אפשר את העלייה הרביעית.`},
{t:`הספר הלבן השני (פספילד, 1930) ואיגרת מקדונלד`, b:[
`<b>אוקטובר 1930, שר המושבות פספילד</b>, אחרי שאו והופ-סימפסון.`,
`<b>ההגבלות:</b> הגבלת <b>מכירת קרקעות</b> ליהודים. העלייה תיקבע גם לפי <b>האבטלה בקרב הערבים</b>. כוונה להקים <b>מועצה מחוקקת</b> עם רוב ערבי. הבית הלאומי כבר לא במרכז.`,
`<b>תגובה ציונית:</b> ויצמן התפטר במחאה, ונוהל מאבק מדיני בלונדון.`,
`<b>13 בפברואר 1931, איגרת מקדונלד:</b> ראש ממשלת בריטניה כתב לוויצמן "פירוש" שביטל בפועל את עיקר ההגבלות. הערבים קראו לה "<b>המכתב השחור</b>".`],
k:`פספילד = נסיגה מהמנדט. מקדונלד = ביטול הנסיגה. מראה את כוחה המדיני של התנועה הציונית בלונדון.`},
{t:`למה המדיניות הבריטית השתנתה? 3 רמות`, b:[
`<b>בין-לאומיות:</b> האינטרסים של האימפריה: דרך הים להודו ותעלת סואץ, והצורך לא להרגיז את העולם המוסלמי (כולל מיליוני מוסלמים בהודו). משבר כלכלי עולמי (1929) ומחיר גבוה לשמירה על הסדר. ממשלת הלייבור שעלתה ב-1929 הייתה פחות אוהדת לציונות.`,
`<b>אזוריות:</b> התחזקות הלאומיות הערבית במזרח התיכון. בריטניה צריכה את תמיכת מדינות ערב והשליטים ההאשמים (עבדאללה בעבר הירדן, פייסל בעיראק). אחרי 1929 המופתי הפך את הסכסוך לעניין של כל המוסלמים.`,
`<b>מקומיות:</b> המאורעות של 1920, 1921 ו-1929 הראו שהערבים, שהם הרוב בארץ, מתנגדים בכוח. בריטניה רצתה שקט ושלטון זול. מסקנות הוועדות על ערבים בלי אדמה.`],
k:`בשאלה פתוחה על "סיבות לשינוי": סיבה אחת מכל רמה + דוגמה לכל אחת.`}
],
B:[
{t:`מוקדי המחלוקת`, b:[
`<b>עלייה:</b> הערבים פחדו להפוך למיעוט בארץ.`,
`<b>קרקעות:</b> יהודים קנו אדמות מבעלי קרקע גדולים (רבים מהם לא גרו בארץ), והאריסים הערבים שעיבדו אותן פונו.`,
`<b>"עבודה עברית":</b> העדפת פועלים יהודים. הערבים טענו שזה מגדיל אבטלה אצלם.`,
`<b>מקומות קדושים:</b> הכותל המערבי והר הבית. לכל שינוי קטן הייתה משמעות דתית.`,
`<b>העתיד הפוליטי:</b> מי ישלוט בארץ. הערבים דרשו לבטל את הצהרת בלפור ולהקים ממשל עם רוב ערבי.`],
k:`בבסיס: שתי תנועות לאומיות שטוענות לאותה ארץ.`},
{t:`1920: תל חי ומאורעות תר"פ`, b:[
`<b>1 במרץ 1920, תל חי:</b> מתקפה על היישוב בגליל העליון בתקופת מאבק בין צרפתים לערבים בצפון. יוסף טרומפלדור וחבריו נהרגו. הפך לסמל של גבורה ושל עמידה על הקרקע.`,
`<b>4–7 באפריל 1920, ירושלים:</b> בחגיגות <b>נבי מוסא</b> נאמו מסיתים (בהם <b>חאג' אמין אל-חוסייני</b>, לימים המופתי) נגד היהודים והציונות. ההמון תקף יהודים בעיר העתיקה. נרצחו כ-5 יהודים ונפצעו כ-200.`,
`<b>ז'בוטינסקי</b> ארגן הגנה עצמית, נעצר ונידון ל-15 שנות מאסר, ושוחרר בחנינה אחרי כמה חודשים.`],
k:`הלקח: אי אפשר לסמוך על הבריטים. ביוני 1920 הוקם ארגון "ההגנה".`},
{t:`1921: מאורעות תרפ"א`, b:[
`<b>רקע:</b> נציב עליון יהודי (סמואל), העלייה השלישית, ובמרץ 1921 <b>צ'רצ'יל</b> ביקר בארץ ו<b>סירב</b> לדרישת הערבים לבטל את הצהרת בלפור ולעצור את העלייה.`,
`<b>הניצוץ, 1 במאי 1921:</b> עימות בין תהלוכת פועלים יהודים קומוניסטים לבין פועלים אחרים, על גבול יפו ותל אביב. בין הערבים התפשטו שמועות, והתחילה מתקפה.`,
`<b>יפו:</b> הותקף "בית העולים". נרצח הסופר <b>יוסף חיים ברנר</b>. המאורעות התפשטו למושבות: <b>פתח תקווה, חדרה, רחובות, כפר סבא</b>.`,
`<b>מחיר:</b> 47 יהודים נרצחו, 146 נפצעו. 48 ערבים נהרגו, רובם מירי כוחות הביטחון.`],
k:`הייקרפט: התהלוכה הייתה רק ניצוץ. הסיבה העמוקה היא העוינות לעלייה ולציונות.`},
{t:`תוצאות תרפ"א`, b:[
`<b>בריטניה:</b> סמואל <b>עצר זמנית את העלייה</b> (14 במאי 1921), ועדת הייקרפט, ובסוף הספר הלבן הראשון. באותה שנה סמואל מינה את חאג' אמין אל-חוסייני למופתי של ירושלים.`,
`<b>היישוב:</b> יהודים עזבו את יפו ועברו ל<b>תל אביב</b>, שהפכה לעיר עצמאית. מגמת היפרדות בין העמים.`,
`בניית <b>משק עברי עצמאי</b> שלא תלוי בעבודה ערבית, וחיזוק ארגון ההגנה.`],
k:`במבחן "השלכות": אחת על המדיניות הבריטית, אחת על היישוב.`},
{t:`1929: הגורמים למאורעות תרפ"ט`, b:[
`<b>הכותל:</b> ביום כיפור (ספטמבר 1928) היהודים הציבו <b>מחיצה</b> בין גברים לנשים. המשטרה הבריטית הוציאה אותה בכוח. המופתי טען שהיהודים משנים את <b>הסטטוס קוו</b> ורוצים להשתלט על הר הבית ואל-אקצא.`,
`<b>המופתי</b> הפך את המאבק הלאומי למאבק <b>דתי</b>: גייס כספים וקרא למוסלמים בעולם "להגן על המקומות הקדושים". חלק מהסיבה: הוא נחלש מול יריביו (משפחת נשאשיבי).`,
`<b>גידול היישוב</b> (תל אביב ויישובים חדשים) והקמת <b>הסוכנות היהודית המורחבת</b> (אוגוסט 1929) נראו לערבים כאיום.`,
`<b>אוגוסט 1929:</b> ב-15 באוגוסט צעדה של נוער יהודי לכותל ("הכותל כותלנו"). למחרת הפגנה ערבית אלימה ברחבת הכותל.`],
k:`המילה החשובה: תרפ"ט = סכסוך שהפך ל<b>דתי</b>.`},
{t:`1929: המאורעות והשלכותיהם`, b:[
`<b>23–29 באוגוסט 1929:</b> אחרי שמועות שקריות שהיהודים עומדים לתקוף את אל-אקצא, התחילו מעשי רצח בירושלים והתפשטו לכל הארץ.`,
`<b>חברון:</b> 67 יהודים נרצחו והקהילה העתיקה ננטשה. גם בצפת היה טבח. יישובים כמו חולדה ובאר טוביה ננטשו.`,
`<b>סך הכול:</b> 133 יהודים נרצחו ו-339 נפצעו. 116 ערבים נהרגו, רובם מירי הבריטים.`,
`<b>השלכות:</b> עזיבת ערים מעורבות, <b>חרם כלכלי הדדי</b>, המופתי למנהיג מוכר בעולם המוסלמי. ב-1931 <b>ההגנה</b> הפכה לארגון <b>ארצי</b> עם מפקדה, "סליקים" (מחבואי נשק), ואחריות של המוסדות הלאומיים במקום ההסתדרות. ובמדיניות: שאו, הופ-סימפסון ופספילד.`],
k:`133 / 67 / 116. ההגנה הייתה חלשה ב-1929, ולכן אורגנה מחדש.`}
],
C:[
{t:`איפה גר היישוב? התפלגות לפי צורת התיישבות`, b:[
`<b>1922:</b> כ-84 אלף יהודים. רק כ-<b>18%</b> בכפר.`,
`<b>1931:</b> כ-175 אלף יהודים (גידול של יותר מפי 2). כ-<b>26%</b> בכפר, וכ-<b>3/4 בערים</b>: תל אביב, ירושלים, חיפה.`,
`<b>בכפר יש 3 צורות:</b> <b>מושבות</b> (פרטיות, למשל פתח תקווה, רחובות), <b>קיבוצים וקבוצות</b> (שיתוף מלא), ו<b>מושבי עובדים</b> (משק משפחתי ושיתוף).`,
`ההתיישבות השיתופית (קיבוצים ומושבים) הייתה <b>מיעוט קטן</b> מהיישוב.`],
k:`הטענה שתמיד חוזרת: רוב היישוב בעיר, אבל להתיישבות החקלאית השיתופית הייתה חשיבות גדולה בהרבה מהגודל שלה.`},
{t:`למה ההתיישבות החקלאית (השיתופית) הייתה חשובה?`, b:[
`<b>קרקע ונוכחות:</b> יישובים במקומות רחוקים קבעו עובדות בשטח ויצרו <b>רצף</b> של יישובים (עמק יזרעאל, עמק הירדן). זה השפיע בהמשך על הגבולות.`,
`<b>ביטחון:</b> שמירה על השטח, ובסיס לכוח המגן.`,
`<b>קליטת חלוצים בלי כסף:</b> יושבו על אדמה לאומית (קק"ל) בכסף לאומי.`,
`<b>"היהודי החדש":</b> עבודה עצמית, חזרה לאדמה, שוויון. הם היו גם ההנהגה של היישוב (תנועת העבודה).`,
`<b>עמק יזרעאל, 1921:</b> קק"ל קנתה אדמות (יהושע חנקין) מלאות ביצות. הוקמו <b>עין חרוד</b> ו<b>תל יוסף</b> (גדוד העבודה) ו<b>נהלל</b>, מושב העובדים הראשון. ייבשו ביצות.`],
k:`מעט אנשים, הרבה שטח, הרבה השפעה.`},
{t:`קיבוץ מול מושב עובדים`, b:[
`<b>קיבוץ:</b> שיתוף מלא בייצור ובצריכה. אין רכוש פרטי. חדר אוכל משותף, החלטות באסיפה הכללית. דגניה (1910) הייתה הקבוצה הראשונה.`,
`<b>מושב עובדים:</b> לכל משפחה משק ובית <b>פרטיים</b>. נהלל (1921) הראשון.`,
`<b>משותף לשניהם:</b> <b>אדמת הלאום</b> (לא פרטית), <b>עבודה עצמית</b> (בלי פועלים שכירים), <b>עזרה הדדית</b>, ו<b>קנייה ושיווק משותפים</b>.`],
k:`ההבדל במשפט: בקיבוץ הכול משותף, במושב רק הקנייה, השיווק והעזרה.`},
{t:`העיר: העלייה הרביעית ותל אביב`, b:[
`<b>העלייה הרביעית (1924–1928):</b> בערך 60 אלף עולים, הרבה מהם <b>מעמד בינוני מפולין</b> עם הון פרטי. דחפו אותם המיסים הכבדים בפולין (גרבסקי), ו<b>ארה"ב סגרה את שעריה</b> (חוק המכסות, 1924).`,
`רובם התיישבו <b>בערים</b>, בעיקר בתל אביב.`,
`<b>תל אביב גדלה מהר מאוד:</b> לפי נתוני העירייה, כ-16,600 תושבים בסוף 1923, כ-27,000 בסוף 1924, וכ-40,000 בסוף 1925. <b>הבנייה</b> הייתה ענף התעסוקה המוביל.`,
`<b>1926–1928, משבר:</b> אבטלה קשה. ב-1927 יותר אנשים עזבו את הארץ ממה שעלו.`],
k:`בדף התרגול כתוב שתל אביב "הכפילה את עצמה בשנה אחת, 1925". המספרים המדויקים: יותר מפי 2 בשנתיים (1924–1925).`},
{t:`תרומת העיר: כלכלה ותרבות עברית`, b:[
`<b>תעשייה:</b> חברת החשמל של <b>פנחס רוטנברג</b> (1923), מפעל המלט <b>"נשר"</b> בחיפה (1925), זיכיון מפעל האשלג ב<b>ים המלח</b> (משה נובומייסקי).`,
`<b>מסחר, בנייה ומלאכה:</b> רוב הפרנסה של היישוב.`,
`<b>תרבות:</b> עיתונות (למשל "דבר", 1925), תיאטרון ("האהל"), ספרות. תל אביב, "העיר העברית הראשונה".`,
`<b>השכלה:</b> הטכניון בחיפה (נפתח 1924), <b>האוניברסיטה העברית</b> בירושלים (1925).`,
`<b>פוליטיקה:</b> בערים ישבו המוסדות, המפלגות וההנהגה.`],
k:`הכפר = שטח וביטחון. העיר = כלכלה, תרבות ורוב האנשים. צריך את שניהם.`},
{t:`ההסתדרות (1920)`, b:[
`הוקמה בדצמבר 1920 כדי לדאוג לכל צורכי הפועלים. מזכ"ל מ-1921: <b>דוד בן-גוריון</b>.`,
`<b>גם איגוד עובדים, גם מעסיקה וגם נותנת שירותים:</b>`,

{t:`הון פרטי מול הון לאומי`, b:[

`<b>אספת הנבחרים:</b> נבחרה לראשונה ב-<b>19 באפריל 1920</b> (314 צירים). גם נשים בחרו, ולכן החרדים התנגדו. בחירות היו ב-1920, 1925, 1931 ו-1944. ב-1931 היו בה 71 חברים. ה"כנסת" של אז: מחליטה, מאשרת תקציב ובוחרת את הוועד הלאומי. לפי התקנות שהבריטים אישרו (1927) יכלה <b>לגבות מסים</b> מחבריה.`,

pts:[[`נתון: רוב בעיר (כ-3/4), בכפר כ-1/4 / השיתופית מיעוט`,3,[`3/4`,`רוב`,`26`,`מיעוט`,`רבע`]],[`סיבה: נוכחות, תפיסת שטח, רצף יישובים, גבולות`,5,[`שטח`,`רצף`,`נוכחות`,`גבול`]],[`סיבה: ביטחון / קליטת חלוצים בלי הון / היהודי החדש והנהגה`,5,[`ביטחון`,`חלוצ`,`הון`,`עבודה עצמית`,`היהודי החדש`,`שמירה`]],[`דוגמה: עמק יזרעאל 1921, קק"ל, ייבוש ביצות, נהלל, עין חרוד`,5,[`יזרעאל`,`נהלל`,`עין חרוד`,`ביצות`,`קק"ל`]]],
model:`ב-1931 כ-3/4 מהיישוב גרו בערים, וההתיישבות השיתופית (קיבוצים ומושבים) הייתה מיעוט קטן. ובכל זאת היא הייתה חשובה מאוד:<br><br><b>1. נוכחות ותפיסת שטח:</b> הקיבוצים והמושבים הוקמו במקומות רחוקים ויצרו רצף של יישובים יהודיים. למשל, ב-1921 קק"ל קנתה אדמות בעמק יזרעאל, החלוצים ייבשו את הביצות והקימו את עין חרוד ואת נהלל. כך נקבעה נוכחות יהודית בשטח, שהשפיעה בהמשך גם על הגבולות.<br><br><b>2. קליטת חלוצים וביטחון:</b> ההתיישבות השיתופית קלטה חלוצים שלא היה להם כסף, על אדמת הלאום ובכסף לאומי. היישובים גם שמרו על השטח והיו בסיס לכוח המגן. בנוסף, הם הגשימו את רעיון "היהודי החדש" שעובד את אדמתו בעבודה עצמית, ומהם יצאה חלק גדול מהנהגת היישוב.`},
{id:`o7`,tp:`C`,q:`הסבר את חשיבותה של ההתיישבות העירונית לבניין הבית הלאומי: תרומה אחת לכלכלה ותרומה אחת לתרבות העברית.`,
hint:`כלכלה: העלייה הרביעית, הון פרטי, תעשייה. תרבות: עיתונות, תיאטרון, אוניברסיטה.`,
pts:[[`רוב היישוב בעיר / העלייה הרביעית, מעמד בינוני והון פרטי`,4,[`רביעית`,`בינוני`,`פרטי`,`רוב`]],[`כלכלה: תעשייה (נשר, חשמל רוטנברג, ים המלח), בנייה, מסחר`,5,[`נשר`,`חשמל`,`רוטנברג`,`בנייה`,`מסחר`,`תעשייה`]],[`תרבות: עיתונות, תיאטרון, ספרות, תל אביב עיר עברית`,5,[`עיתון`,`דבר`,`תיאטרון`,`האהל`,`עברית`]],[`השכלה: האוניברסיטה העברית 1925 / הטכניון`,4,[`אוניברסיטה`,`טכניון`]]],
model:`רוב היישוב גר בערים, ובעיקר העלייה הרביעית (1924–1928), שהביאה מעמד בינוני מפולין עם הון פרטי, התיישבה בהן.<br><br><b>כלכלה:</b> בעיר התפתחו התעשייה, הבנייה והמסחר, שנתנו פרנסה לרוב היישוב. בהון פרטי הוקמו מפעלים כמו חברת החשמל של פנחס רוטנברג (1923) ומפעל המלט "נשר" בחיפה (1925). הבנייה הייתה ענף התעסוקה המוביל בתל אביב. כך היישוב בנה כלכלה מודרנית שיכולה לקלוט עוד עולים.<br><br><b>תרבות:</b> העיר הייתה מרכז התרבות העברית: עיתונים כמו "דבר", תיאטרון "האהל", ספרות, ותל אביב כ"עיר העברית הראשונה". ב-1925 נפתחה האוניברסיטה העברית בירושלים, וב-1924 הטכניון בחיפה. כך נוצרה תרבות לאומית בעברית, שחיזקה את הזהות של הבית הלאומי.`},
{id:`o8`,tp:`C`,q:`הצג את ההבדל בין הון פרטי להון לאומי, והסבר את התרומה של כל אחד מהם לבניין הבית הלאומי.`,
hint:`הגדרה לכל אחד ← לאן הלך ← דוגמה ← למה צריך את שניהם.`,
pts:[[`הגדרה: לאומי = תרומות דרך קרנות (קק"ל, קרן היסוד)`,4,[`תרומ`,`קק"ל`,`קרן היסוד`,`קרן קיימת`]],[`הגדרה: פרטי = השקעות של אנשים שרוצים רווח`,4,[`רווח`,`השקע`,`פרטי`]],[`תרומת הלאומי: קרקע של העם, התיישבות בספר, קליטת חלוצים`,5,[`קרקע`,`התיישבות`,`חלוצ`,`יזרעאל`,`קיבוץ`]],[`תרומת הפרטי: עיר, תעשייה, פרדסים, מושבות, העלייה הרביעית`,5,[`תעשי`,`פרדס`,`הדרים`,`נשר`,`מושבות`,`רביעית`,`תל אביב`]]],
model:`<b>הון לאומי</b> הוא כסף מתרומות שגייסה התנועה הציונית דרך הקרנות: הקרן הקיימת (קק"ל) קנתה קרקעות שנשארו קניין העם, וקרן היסוד (1920) מימנה עלייה, התיישבות ומוסדות. ההון הלאומי הלך למטרות שלא מביאות רווח אבל חשובות לבית הלאומי: רכישת אדמות בעמק יזרעאל, ייבוש ביצות והקמת קיבוצים ומושבים במקומות רחוקים, וקליטת חלוצים שלא היה להם כסף.<br><br><b>הון פרטי</b> הוא השקעות של אנשים וחברות שרוצים להרוויח, בעיקר של עולי העלייה הרביעית. הוא בנה את הכלכלה העירונית: בנייה בתל אביב, מסחר, תעשייה (כמו "נשר" וחברת החשמל), ופרדסי הדרים במושבות החדשות כמו רעננה והרצליה, שהפכו לענף הייצוא המוביל.<br><br>הבית הלאומי נבנה משניהם: הלאומי קבע את הנוכחות בשטח, והפרטי בנה את הכלכלה שבה חיו רוב האנשים.`},
{id:`o9`,tp:`D`,q:`הצג שניים ממוסדות היישוב שנבחרו בשיטה דמוקרטית, והסבר את תפקידו של כל אחד מהם. הסבר מדוע הם נחשבו "מדינה בדרך".`,
hint:`מוסד 1 (מי בחר + תפקיד) ← מוסד 2 ← "מדינה בדרך" + חולשה.`,
pts:[[`מוסד 1: אספת הנבחרים, נבחרה ב-1920 בידי יהודי הארץ, "פרלמנט"`,5,[`אספת הנבחרים`,`1920`,`מחוקק`,`פרלמנט`]],[`מוסד 2: הוועד הלאומי (מבצע: חינוך, בריאות) / הקונגרס / הסוכנות`,5,[`ועד הלאומי`,`קונגרס`,`סוכנות`,`מבצע`,`חינוך`]],[`מדינה בדרך: נבחרו, ייצגו, ניהלו תחומים של מדינה, הרגל לדמוקרטיה`,5,[`מדינה בדרך`,`דמוקרט`,`ייצג`,`תפקידים`]],[`חולשה: וולונטרי, בלי כוח לכפות`,3,[`וולונטרי`,`לכפות`,`חרדים`]]],
model:`<b>אספת הנבחרים:</b> נבחרה לראשונה באפריל 1920 בבחירות כלליות של יהודי ארץ ישראל, כולל נשים. היא הייתה ה"פרלמנט" של היישוב: קיבלה החלטות, אישרה תקציב ובחרה את הוועד הלאומי.<br><br><b>הוועד הלאומי:</b> הזרוע המבצעת של האספה. הוא ניהל את ענייני הפנים של היישוב, כמו חינוך, בריאות וסעד, וייצג את היישוב מול השלטון הבריטי. הבריטים הכירו בו רשמית ב-1928.<br><br><b>"מדינה בדרך":</b> המוסדות נבחרו דמוקרטית, ייצגו את היישוב וניהלו תחומים שמדינה מנהלת, ולכן היו כמו ממשלה ופרלמנט לפני שהייתה מדינה. הם הרגילו את היישוב לחיים דמוקרטיים, ובקום המדינה הם הפכו לבסיס למוסדות שלה. החולשה שלהם: החברות הייתה וולונטרית ולא היה להם כוח לכפות את ההחלטות.`},
{id:`o10`,tp:`A`,q:`הסבר את תפקידן של ועדות החקירה הבריטיות. הצג את המסקנות של ועדה אחת, והסבר כיצד השפיעו על המדיניות הבריטית.`,
hint:`תפקיד ← ועדה אחת (מתי, למה, מה קבעה) ← איזה ספר לבן יצא ממנה.`,
pts:[[`תפקיד: לחקור את הסיבות למאורעות ולהמליץ על מדיניות`,4,[`לחקור`,`סיבות`,`להמליץ`,`המלצ`]],[`ועדה: שם + מאורעות (הייקרפט 1921 / שאו 1930 / הופ-סימפסון)`,4,[`הייקרפט`,`שאו`,`הופ`]],[`מסקנה: הסיבה העמוקה = פחד מעלייה וקרקעות / אין עודף קרקע`,5,[`עלייה`,`קרקע`,`פחד`,`עוינות`,`עודף`]],[`השפעה: ספר לבן 1922 / פספילד 1930 שהגביל`,5,[`ספר לבן`,`פספילד`,`1922`,`1930`,`הגביל`]]],
model:`<b>תפקיד הוועדות:</b> אחרי כל גל של מאורעות שלחו הבריטים ועדת חקירה, כדי לבדוק מה גרם לאלימות ולהמליץ על המדיניות. בפועל, ההמלצות שלהן הובילו בכל פעם להגבלות על הבית הלאומי.<br><br><b>ועדת שאו (1930):</b> נשלחה לחקור את מאורעות תרפ"ט (1929). היא קבעה שהסיבה העמוקה היא הפחד של הערבים מהעלייה היהודית ומרכישת הקרקעות, ושנוצר מעמד של ערבים בלי אדמה. היא המליצה לבדוק את נושאי העלייה והקרקעות. אחריה בא דו"ח הופ-סימפסון, שקבע שאין עודף קרקע להתיישבות עולים חדשים.<br><br><b>ההשפעה:</b> בעקבות שתיהן פרסם שר המושבות פספילד באוקטובר 1930 את הספר הלבן השני, שהגביל את מכירת הקרקעות ליהודים וקבע שהעלייה תתחשב באבטלה בקרב הערבים. זו הייתה נסיגה מהתחייבויות המנדט.`}

function ymd(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}
function todayIdx(){const t=ymd(new Date());let i=DAYS.findIndex(d=>d.date===t);if(i<0)i=t<DAYS[0].date?0:DAYS.length-1;return i}
function status(){
  const ti=todayIdx();let behind=0,ahead=0,todayLeft=0,todayMin=0;
  DAYS.forEach((d,i)=>d.steps.forEach(s=>{const done=!!S.steps[s.id];
    if(i<ti&&!done)behind++; if(i>ti&&done)ahead++; if(i===ti&&!done){todayLeft++;todayMin+=s.min}}));
  return {ti,behind,ahead,todayLeft,todayMin};
}
function nextStep(){const ti=todayIdx();for(let i=0;i<=ti;i++)for(const s of DAYS[i].steps)if(!S.steps[s.id])return s;
  for(let i=ti+1;i<DAYS.length;i++)for(const s of DAYS[i].steps)if(!S.steps[s.id])return s;return null}

/* ===== מדדים ===== */
const QBY=id=>Q.find(q=>q.id===id);
function topicStats(tp){
  const qs=Q.filter(q=>q.tp===tp&&q.t!=='short');const ans=qs.filter(q=>S.ans[q.id]);
  const ok=ans.filter(q=>S.ans[q.id].ok).length;
  const cards=(CARDS[tp]||[]).length;const seen=(CARDS[tp]||[]).filter((c,i)=>S.seen[tp+i]).length;
  const opens=OPEN.filter(o=>o.tp===tp&&S.open[o.id]&&S.open[o.id].score!=null);
  const acc=ans.length?ok/ans.length:0;const cov=ans.length/qs.length;
  let r=0.3*(cards?seen/cards:0)+0.5*acc*Math.min(1,ans.length/8)+0.2*cov;
  if(opens.length){const os=opens.reduce((s,o)=>s+S.open[o.id].score,0)/(opens.length*18);r=r*0.8+os*0.2}
  return {pct:Math.round(r*100),seen,cards,ans:ans.length,total:qs.length,ok};
}
function lvl(p){return p<40?'lo':p<70?'md':'hi'}

/* ===== עזרים ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const L='אבגדהוזח';
function go(h){location.hash=h}
let timerInt=null;
function view(html,tab){clearInterval(timerInt);$('#app').innerHTML='<div class="fade">'+html+'</div>';
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));window.scrollTo(0,0)}
function topBar(title,back){return `<div class="top"><button class="back" aria-label="חזרה" onclick="${back?`go('${back}')`:'history.back()'}">→</button><h2>${title}</h2></div>`}
function ring(p){const r=26,c=2*Math.PI*r;return `<svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="#272C38" stroke-width="7"/><circle cx="32" cy="32" r="${r}" fill="none" stroke="#E3B04B" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c*p/100} ${c}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" fill="#EDE8DE" font-size="15" font-weight="700">${p}%</text></svg>`}

/* ===== בית ===== */
function home(){
  const st=status();const now=new Date();let ms=EXAM-now;const past=ms<=0;ms=Math.max(0,ms);
  const dd=Math.floor(ms/864e5),hh=Math.floor(ms/36e5)%24,mm=Math.floor(ms/6e4)%60;
  const all=DAYS.flatMap(d=>d.steps);const done=all.filter(s=>S.steps[s.id]).length;const pct=Math.round(done/all.length*100);
  let chip;
  if(past)chip=`<span class="chip info">המבחן התחיל. בהצלחה!</span>`;
  else if(st.behind)chip=`<span class="chip bad">● מפגר: ${st.behind} שלבים מימים קודמים</span>`;
  else if(st.todayLeft===0)chip=`<span class="chip ok">● סיימת את היום${st.ahead?', ואפילו מקדים':''}</span>`;
  else if(st.ahead)chip=`<span class="chip ok">● מקדים את התוכנית</span>`;
  else chip=`<span class="chip warn">● בזמן. נשארו להיום ${st.todayLeft} שלבים, כ-${st.todayMin} דק'</span>`;
  const nx=nextStep();
  const d=DAYS[st.ti];
  const days=DAYS.map((d,i)=>{const cls=i<st.ti?'past':i===st.ti?'today':'';
    const dn=d.steps.filter(s=>S.steps[s.id]).length;const mins=d.steps.reduce((a,s)=>a+s.min,0);
    if(i!==st.ti)return `<div class="card day ${cls}"><div class="day-h"><div class="sp"><h3>${d.name} <span class="mu sm">· ${d.title}</span></h3><div class="d">${dn}/${d.steps.length} שלבים · כ-${mins} דק'</div></div>${dn===d.steps.length?'<span class="chip ok">✓</span>':i<st.ti?'<span class="chip bad">חסר</span>':''}</div>${i<st.ti&&dn<d.steps.length?stepsHtml(d):''}</div>`;
    return `<div class="card day today"><div class="day-h"><div class="sp"><div class="d">היום · ${d.name}</div><h3>${d.title}</h3></div><span class="mu sm">${dn}/${d.steps.length}</span></div>${stepsHtml(d)}</div>`}).join('');
  const bars=['A','B','C','D'].map(tp=>{const s=topicStats(tp);return `<div class="tbar"><div style="font-size:20px">${TOPICS[tp].icon}</div><div><div class="row"><span>${TOPICS[tp].name}</span><span class="sp"></span><span class="xs mu">${TOPICS[tp].weight} מהחומר</span></div><div class="bar"><i class="${lvl(s.pct)}" style="width:${Math.max(3,s.pct)}%"></i></div></div><div class="pct">${s.pct}%</div></div>`}).join('');
  view(`
  <section class="hero">
    <div class="row"><div class="sp"><div class="kick">היסטוריה · יום שלישי 17.11 בבוקר</div><h1>מבית לאומי למדינה בדרך</h1></div>${ring(pct)}</div>
    <div class="cd"><div><b>${dd}</b><span>ימים</span></div><div><b>${hh}</b><span>שעות</span></div><div><b>${mm}</b><span>דקות</span></div></div>
    <div style="margin-top:14px">${chip}</div>
  </section>
  ${nx&&!past?`<div class="sec"><button class="btn pri" onclick="go('${nx.go}')">המשך: ${nx.label} ←</button></div>`:''}
  <div class="sec"><div class="lbl">התוכנית</div><div class="stack">${days}</div></div>
  <div class="sec"><div class="lbl">כמה אתה מוכן בכל נושא</div><div class="card tight">${bars}</div>
  <p class="xs mu" style="margin:8px 2px 0">האחוז משקלל: כרטיסים שקראת, כמה שאלות ענית ומה אחוז ההצלחה. האחוז מכמות החומר הוא הערכה שלי, המורה לא נתנה חלוקה.</p></div>
  <div class="sec"><div class="lbl">מבנה המבחן · 90 דקות</div><div class="card"><div class="split"><div class="a">8 אמריקאיות · 64</div><div class="b">2 פתוחות · 36</div></div>
  <p class="sm mu" style="margin:10px 0 0">כל אמריקאית 8 נק'. כל פתוחה 18 נק'. החומר: מתחילת השנה, <b>בלי</b> העלייה החמישית ומה שאחריה.</p></div></div>
  `,'home');
}
function stepsHtml(d){return d.steps.map(s=>`<button class="step ${S.steps[s.id]?'done':''}" onclick="go('${s.go}')"><span class="ck">${S.steps[s.id]?'✓':''}</span><span class="st sp">${s.label}</span><span class="min">${s.min} דק'</span><span class="go">‹</span></button>`).join('')}

/* ===== לימוד ===== */
function learnList(){
  const tiles=['M','A','B','C','D'].map(tp=>{const c=CARDS[tp];const seen=c.filter((x,i)=>S.seen[tp+i]).length;
    return `<button class="tile" onclick="go('learn/${tp}')"><div class="row"><span class="ic">${TOPICS[tp].icon}</span><span class="sp"></span><span class="xs mu">${seen}/${c.length}</span></div><div><div class="tt">${TOPICS[tp].name}</div><div class="ss">${c.length} כרטיסים</div></div></button>`}).join('');
  view(`<div class="top"><h2>לימוד</h2></div><p class="mu sm" style="margin-top:-6px">כל כרטיס = רעיון אחד. קוראים, לוחצים "הבנתי", ממשיכים.</p><div class="grid2">${tiles}</div>
  <div class="sec"><button class="btn sec2" onclick="go('sheet')">📌 דף "חובה לזכור": תאריכים ומספרים</button></div>`,'learn');
}
function learn(tp,i){
  const cs=CARDS[tp];i=Math.max(0,Math.min(cs.length-1,i|0));const c=cs[i];
  S.seen[tp+i]=1;save();
  const last=i===cs.length-1;
  if(last&&cs.every((x,j)=>S.seen[tp+j]))markGo('learn/'+tp);
  const dots=cs.map((x,j)=>`<i class="${j===i?'on':S.seen[tp+j]?'seen':''}"></i>`).join('');
  view(`${topBar(TOPICS[tp].name,'learn')}
  <div class="card lcard"><div class="xs mu" style="margin-bottom:4px">כרטיס ${i+1} מתוך ${cs.length}</div><h2>${c.t}</h2><ul>${c.b.map(x=>`<li>${x}</li>`).join('')}</ul><div class="key" style="margin-top:14px">${c.k}</div></div>
  <div class="dots">${dots}</div>
  <div class="btns">${i>0?`<button class="btn ghost" onclick="go('learn/${tp}/${i-1}')">→ הקודם</button>`:''}
  ${last?(tp==='M'?`<button class="btn pri" onclick="go('home')">הבנתי, חזרה לתוכנית</button>`:`<button class="btn pri" onclick="go('practice/${tp}')">הבנתי. לתרגול ←</button>`):`<button class="btn pri" onclick="go('learn/${tp}/${i+1}')">הבנתי ←</button>`}</div>`,'learn');
  let x0=null;const el=$('.lcard');el.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
  el.addEventListener('touchend',e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60){if(dx>0&&!last)go(`learn/${tp}/${i+1}`);if(dx<0&&i>0)go(`learn/${tp}/${i-1}`)}x0=null});
}

/* ===== מנוע שאלות ===== */
let RUN=null;
function startRun(kind,qs,opts){RUN=Object.assign({kind,qs,i:0,ok:0,res:[],done:false},opts||{});renderQ()}
function pickPractice(tps,n){
  const pool=Q.filter(q=>tps.includes(q.tp));
  const un=shuf(pool.filter(q=>!S.ans[q.id])),wr=shuf(pool.filter(q=>S.ans[q.id]&&!S.ans[q.id].ok)),rest=shuf(pool.filter(q=>S.ans[q.id]&&S.ans[q.id].ok));
  return un.concat(wr,rest).slice(0,n);
}
function practiceList(){
  const t=['A','B','C','D'].map(tp=>{const s=topicStats(tp);return `<button class="tile" onclick="go('practice/${tp}')"><div class="row"><span class="ic">${TOPICS[tp].icon}</span><span class="sp"></span><span class="xs mu">${s.ans}/${s.total}</span></div><div><div class="tt">${TOPICS[tp].name}</div><div class="ss">${s.ans?Math.round(s.ok/s.ans*100)+'% הצלחה':'עוד לא התחלת'}</div></div></button>`}).join('');
  view(`<div class="top"><h2>תרגול</h2></div><p class="mu sm" style="margin-top:-6px">כל סבב: 12 שאלות. קודם שאלות שלא ענית, אחר כך טעויות. כל השאלות מדף התרגול נמצאות כאן (מסומנות "מהדף"), ולצידן שאלות אמריקאיות חדשות בסגנון המבחן.</p>
  <div class="grid2">${t}</div>
  <div class="sec stack"><button class="btn sec2" onclick="go('practice/ALL')">🎲 סבב מעורב מכל הנושאים</button>
  <button class="btn sec2" onclick="go('wrong')">🔁 חזרה על הטעויות (${S.wrong.length})</button>
  <button class="btn sec2" onclick="go('diag')">🩺 מבחן אבחון (10 שאלות)</button></div>`,'practice');
}
function renderQ(){
  const R=RUN;if(R.i>=R.qs.length)return endRun();
  const q=R.qs[R.i];R.cur={q,sel:null,checked:false};
  const tl=R.timed?`<span class="timer" id="tmr"></span>`:'';
  view(`${topBar(R.title,R.back||'practice')}
  <div class="qhead"><span class="xs mu">${R.i+1}/${R.qs.length}</span><div class="prog"><i style="width:${R.i/R.qs.length*100}%"></i></div>${tl}</div>
  <div class="card"><div class="row" style="gap:6px"><span class="tag">${TOPICS[q.tp].short}</span>${q.src==='f'?'<span class="tag f">מהדף</span>':''}<span class="tag">${({mc:'אמריקאית',tf:'נכון / לא נכון',multi:'סמן את כל הנכונים',match:'התאמה',order:'סדר',cloze:'השלמה',sort:'מיון',short:'תשובה קצרה'})[q.t]}</span></div>
  <div class="qtext">${esc(q.q)}</div><div id="ans">${ansUI(q)}</div><div id="fb"></div></div>
  <div class="sec"><button class="btn pri" id="chk" onclick="check()">${q.t==='short'?'הראה תשובה לדוגמה':'בדיקה'}</button></div>`,R.tab||'practice');
  if(R.timed)tick();
}
function ansUI(q){
  const o=(t,i)=>`<button class="opt" data-i="${i}" onclick="pick(this)"><span class="l">${L[i]}</span><span>${esc(t)}</span></button>`;
  if(q.t==='mc'){return shuf(q.o.map((t,i)=>i)).map((i,k)=>`<button class="opt" data-i="${i}" onclick="pick(this)"><span class="l">${L[k]}</span><span>${esc(q.o[i])}</span></button>`).join('')}
  if(q.t==='multi')return q.o.map((t,i)=>`<button class="opt" data-i="${i}" onclick="this.classList.toggle('sel')"><span class="l">☐</span><span>${esc(t)}</span></button>`).join('');
  if(q.t==='tf')return `<div class="tfrow"><button class="opt" data-i="1" onclick="pick(this)">נכון</button><button class="opt" data-i="0" onclick="pick(this)">לא נכון</button></div>`;
  if(q.t==='match'){const rs=shuf(q.pairs.map(p=>p[1]));return q.pairs.map((p,i)=>`<div class="mrow"><div class="lt">${esc(p[0])}</div><select data-i="${i}"><option value="">בחר...</option>${rs.map(r=>`<option>${esc(r)}</option>`).join('')}</select></div>`).join('')}
  if(q.t==='cloze'){let k=0;const bank=shuf(q.bank);return `<div class="cloze">${esc(q.q).split('___').map((part,i,arr)=>part+(i<arr.length-1?`<select data-i="${k++}"><option value="">...</option>${bank.map(b=>`<option>${esc(b)}</option>`).join('')}</select>`:'')).join('')}</div>`}
  if(q.t==='sort')return q.items.map((it,i)=>`<div class="mrow"><div class="lt">${esc(it[0])}</div><div class="segs" data-i="${i}">${q.cats.map((c,j)=>`<button class="seg" data-j="${j}" onclick="segPick(this)">${esc(c)}</button>`).join('')}</div></div>`).join('');
  if(q.t==='order'){q._sh=shuf(q.items.map((t,i)=>i));return `<p class="xs mu" style="margin-top:-6px">לחץ לפי הסדר: מה קרה ראשון, שני, שלישי.</p><div class="ordl">${q._sh.map(i=>`<button class="opt" data-i="${i}" onclick="ordPick(this)"><span class="l"></span><span>${esc(q.items[i])}</span></button>`).join('')}</div>`}
  if(q.t==='short')return `<textarea id="sh" style="min-height:120px" placeholder="תכתוב משפט או שניים...">${esc((S.open[q.id]||{}).text||'')}</textarea>`;
}
function pick(b){if(RUN.cur.checked)return;b.parentElement.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');RUN.cur.sel=+b.dataset.i}
function segPick(b){if(RUN.cur.checked)return;b.parentElement.querySelectorAll('.seg').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}
function ordPick(b){if(RUN.cur.checked)return;const c=RUN.cur;c.ord=c.ord||[];const i=+b.dataset.i;
  if(c.ord.includes(i)){c.ord=c.ord.filter(x=>x!==i)}else c.ord.push(i);
  document.querySelectorAll('.ordl .opt').forEach(x=>{const k=c.ord.indexOf(+x.dataset.i);x.classList.toggle('sel',k>=0);x.querySelector('.l').textContent=k>=0?k+1:''})}
function grade(q){const A=$('#ans');
  if(q.t==='mc'){const s=RUN.cur.sel;if(s==null)return null;A.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;if(i===q.a)b.classList.add('right');else if(i===s)b.classList.add('wrong')});return s===q.a}
  if(q.t==='tf'){const s=RUN.cur.sel;if(s==null)return null;const ok=(s===1)===q.a;A.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const v=+b.dataset.i===1;if(v===q.a)b.classList.add('right');else if(+b.dataset.i===s)b.classList.add('wrong')});return ok}
  if(q.t==='multi'){const sel=[...A.querySelectorAll('.opt.sel')].map(b=>+b.dataset.i);if(!sel.length)return null;let ok=true;
    A.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i,should=q.a.includes(i),is=sel.includes(i);b.disabled=true;if(should)b.classList.add('right');if(is&&!should){b.classList.add('wrong')}if(should!==is)ok=false});return ok}
  if(q.t==='match'){const ss=[...A.querySelectorAll('select')];if(ss.some(s=>!s.value))return null;let ok=true;ss.forEach(s=>{const r=q.pairs[+s.dataset.i][1];const g=s.value===r;s.classList.add(g?'right':'wrong');if(!g){ok=false;s.insertAdjacentHTML('afterend',`<div class="xs" style="color:var(--ok);margin-top:4px">✓ ${esc(r)}</div>`)}s.disabled=true});return ok}
  if(q.t==='cloze'){const ss=[...A.querySelectorAll('select')];if(ss.some(s=>!s.value))return null;let ok=true;ss.forEach(s=>{const r=q.a[+s.dataset.i];const g=s.value===r;s.classList.add(g?'right':'wrong');if(!g){ok=false;s.insertAdjacentHTML('afterend',`<span class="xs" style="color:var(--ok)">(${esc(r)})</span>`)}s.disabled=true});return ok}
  if(q.t==='sort'){const rows=[...A.querySelectorAll('.segs')];if(rows.some(r=>!r.querySelector('.sel')))return null;let ok=true;rows.forEach(r=>{const want=q.items[+r.dataset.i][1];r.querySelectorAll('.seg').forEach(b=>{const j=+b.dataset.j;b.disabled=true;if(j===want)b.classList.add('right');else if(b.classList.contains('sel')){b.classList.add('wrong');ok=false}})});return ok}
  if(q.t==='order'){const o=RUN.cur.ord||[];if(o.length<q.items.length)return null;const ok=o.every((v,k)=>v===k);document.querySelectorAll('.ordl .opt').forEach(b=>{const i=+b.dataset.i;b.disabled=true;b.classList.add(o.indexOf(i)===i?'right':'wrong');b.querySelector('.l').textContent=i+1});return ok}
}
function check(){
  const R=RUN,c=R.cur,q=c.q;
  if(c.checked){R.i++;return renderQ()}
  if(q.t==='short'){const t=$('#sh').value;S.open[q.id]={text:t};save();c.checked=true;
    $('#fb').innerHTML=`<div class="fb ok"><div class="h">תשובה לדוגמה</div>${q.model}</div><p class="xs mu">השווה לתשובה שלך: יש בה את אותו רעיון?</p><div class="btns" style="margin-top:8px"><button class="btn sec2" onclick="selfMark(1)">כן, היה לי ✓</button><button class="btn ghost" onclick="selfMark(0)">לא ממש</button></div>`;
    $('#chk').style.display='none';return}
  const ok=grade(q);
  if(ok==null){$('#fb').innerHTML=`<div class="fb bad">צריך לענות על הכול לפני בדיקה.</div>`;return}
  record(q,ok);c.checked=true;
  if(R.exam){R.i++;return renderQ()}
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><div class="h">${ok?'נכון ✓':'לא נכון'}</div>${q.ex?esc(q.ex):''}</div>`;
  $('#chk').textContent=R.i===R.qs.length-1?'סיום':'הבא ←';
}
function selfMark(ok){record(RUN.cur.q,!!ok);RUN.i++;renderQ()}
function record(q,ok){const a=S.ans[q.id]||{n:0};a.n++;a.ok=ok;S.ans[q.id]=a;
  if(!ok){if(!S.wrong.includes(q.id))S.wrong.push(q.id)}else S.wrong=S.wrong.filter(x=>x!==q.id);
  RUN.res.push({id:q.id,ok});if(ok)RUN.ok++;save()}
function endRun(){
  const R=RUN;if(R.onEnd)return R.onEnd();
  if(R.go)markGo(R.go);
  const p=Math.round(R.ok/R.qs.length*100);
  const wrongs=R.res.filter(r=>!r.ok).map(r=>QBY(r.id));
  let msg=p>=85?'מצוין. הנושא הזה אצלך.':p>=60?'טוב, אבל יש מה לחזק. עבור על הטעויות.':'עוד לא. כדאי לקרוא שוב את הכרטיסים ואז סבב נוסף.';
  view(`${topBar('סיכום הסבב','home')}
  <div class="card" style="text-align:center"><div class="score">${R.ok}/${R.qs.length}</div><div class="mu" style="margin-top:6px">${p}% · ${msg}</div></div>
  ${R.diag?diagReport():''}
  ${wrongs.length?`<div class="sec"><div class="lbl">טעית ב:</div><div class="card tight">${wrongs.map(q=>`<div class="mrow sm">${esc(q.q)}<div class="xs" style="color:var(--ok);margin-top:4px">${esc(answerText(q))}</div></div>`).join('')}</div></div>`:''}
  <div class="sec stack"><button class="btn pri" onclick="go('home')">חזרה לתוכנית</button>${R.again?`<button class="btn sec2" onclick="go('${R.again}');route()">סבב נוסף</button>`:''}</div>`,R.tab||'practice');
}
function answerText(q){
  if(q.t==='mc')return '✓ '+q.o[q.a];if(q.t==='tf')return '✓ '+(q.a?'נכון':'לא נכון');
  if(q.t==='multi')return '✓ '+q.a.map(i=>q.o[i]).join(' · ');if(q.t==='cloze')return '✓ '+q.a.join(' / ');
  if(q.t==='match')return q.pairs.map(p=>p[0]+' ← '+p[1]).join(' · ');if(q.t==='order')return q.items.map((t,i)=>(i+1)+'. '+t).join(' ');
  if(q.t==='sort')return q.cats.map((c,j)=>c+': '+q.items.filter(x=>x[1]===j).map(x=>x[0]).join(', ')).join(' | ');return ''}

/* אבחון */
const DIAG=[`a1`,`a3`,`a5`,`b1`,`b5`,`b6`,`c1`,`c3`,`c5`,`d2`];
function diag(){startRun('diag',DIAG.map(QBY),{title:'מבחן אבחון',go:'diag',diag:true,back:'home',tab:'home'})}
function diagReport(){const by={};RUN.res.forEach(r=>{const tp=QBY(r.id).tp;by[tp]=by[tp]||[0,0];by[tp][1]++;if(r.ok)by[tp][0]++});
  return `<div class="sec"><div class="lbl">לפי נושא</div><div class="card tight">${Object.keys(by).map(tp=>`<div class="mrow row"><span>${TOPICS[tp].icon} ${TOPICS[tp].name}</span><span class="sp"></span><b>${by[tp][0]}/${by[tp][1]}</b></div>`).join('')}</div><p class="xs mu" style="margin:8px 2px">זה רק נקודת פתיחה. התוכנית עוברת על כל הנושאים בכל מקרה.</p></div>`}

/* ===== שאלות פתוחות ===== */
function openList(){
  const items=OPEN.map(o=>{const s=S.open[o.id];return `<button class="step" onclick="go('open/${o.id}')"><span class="ck" style="${s&&s.score!=null?'background:var(--ok);border-color:var(--ok);color:#0b1a12':''}">${s&&s.score!=null?'✓':''}</span><span class="sp"><span class="xs mu">${TOPICS[o.tp].icon} ${TOPICS[o.tp].name}</span><br>${esc(o.q)}</span>${s&&s.score!=null?`<span class="min">${s.score}/18</span>`:''}</button>`}).join('');
  view(`<div class="top"><h2>שאלות פתוחות</h2></div>
  <div class="card tight" style="margin-bottom:12px"><div class="sm"><b>איך זה עובד:</b> כותבים תשובה, לוחצים "בדוק אותי". הכלי מסמן אילו נקודות מצא בתשובה שלך (לפי מילות מפתח). אתה מתקן את הסימון אם צריך, ומקבל ציון מתוך 18 ותשובה לדוגמה.</div></div>
  <div class="card day">${items}</div>
  <div class="sec"><button class="btn sec2" onclick="go('learn/M')">✍️ איך בונים תשובה פתוחה</button></div>`,'open');
}
function openQ(id,inMock){
  if(!inMock)RUN=null;
  const o=OPEN.find(x=>x.id===id);const st=S.open[id]||{};
  view(`${inMock?'':topBar('שאלה פתוחה · 18 נק\'','open')}
  <div class="card"><div class="row" style="gap:6px;margin-bottom:6px"><span class="tag">${TOPICS[o.tp].short}</span><span class="tag">18 נקודות</span></div>
  <div class="qtext">${esc(o.q)}</div>
  <details><summary>איך לבנות את התשובה</summary><div class="sm" style="padding:4px 0 8px">${o.hint}<br><span class="mu">פסקה לכל פריט שמבקשים. בכל פסקה: מושג ← עובדה ← "משום ש" / "ולכן".</span></div></details>
  <textarea id="ot" placeholder="תכתוב כאן את התשובה שלך...">${esc(st.text||'')}</textarea>
  <div class="xs mu" id="wc"></div></div>
  <div class="sec"><button class="btn pri" onclick="openCheck('${id}')">בדוק אותי</button></div><div id="ores"></div>`,'open');
  const ta=$('#ot');const wc=()=>{const n=ta.value.trim().split(/\s+/).filter(Boolean).length;$('#wc').textContent=n+' מילים'+(n&&n<60?' · כדאי לפחות 60–80 מילים':'');S.open[id]=Object.assign(S.open[id]||{},{text:ta.value});save()};ta.addEventListener('input',wc);wc();
  if(st.got)openCheck(id,true);
}
function openCheck(id,restore){
  const o=OPEN.find(x=>x.id===id);const t=($('#ot')||{}).value||'';
  const st=S.open[id]=Object.assign(S.open[id]||{},{text:t});
  if(!restore||!st.got)st.got=o.pts.map(p=>p[2].some(k=>t.includes(k)));
  const words=t.trim().split(/\s+/).filter(Boolean).length;const draw=()=>{let sc=o.pts.reduce((s,p,i)=>s+(st.got[i]?p[1]:0),0);const short=words<45;if(short)sc=Math.min(sc,8);st.score=sc;save();
    $('#ores').innerHTML=`<div class="sec card"><div class="row"><div><div class="xs mu">ציון משוער</div><div class="score">${sc}<span class="mu" style="font-size:22px">/18</span></div></div><span class="sp"></span><span class="chip ${short?'bad':sc>=14?'ok':sc>=9?'warn':'bad'}">${short?'קצר מדי':sc>=14?'תשובה טובה':sc>=9?'חסרות נקודות':'צריך לחזק'}</span></div>${short?`<p class="sm" style="color:var(--bad);margin:8px 0 0">${words} מילים. בבגרות מילת מפתח בלי הסבר לא מקבלת את כל הנקודות, ולכן הציון מוגבל ל-8 עד שתכתוב לפחות 45 מילים.</p>`:''}
    <p class="xs mu" style="margin:10px 0">מה הבודק מחפש. הסימון אוטומטי לפי מילים, אז תתקן אותו בכנות: לחץ על נקודה כדי לסמן או לבטל.</p>
    ${o.pts.map((p,i)=>`<button class="pt ${st.got[i]?'on':''}" onclick="tgPt('${id}',${i})"><span class="ck">${st.got[i]?'✓':''}</span><span>${esc(p[0])}</span><span class="w">${p[1]} נק'</span></button>`).join('')}
    <details style="margin-top:8px"><summary>תשובה לדוגמה</summary><div class="model">${o.model}</div></details></div>
    ${RUN&&RUN.mockOpen?`<div class="sec"><button class="btn pri" onclick="mockNextOpen()">המשך ←</button></div>`:''}`;
    markGo('open/'+id)};
  window.tgPt=(id2,i)=>{st.got[i]=!st.got[i];draw()};
  draw();if(!restore)$('#ores').scrollIntoView({behavior:'smooth'});
}

/* ===== מבחן דמה ===== */
function mockMenu(){view(`${topBar('מבחן דמה','more')}
  <div class="stack"><button class="card" style="text-align:right;width:100%" onclick="startMock('mini')"><h3>מקוצר · 25 דקות</h3><p class="sm mu" style="margin:4px 0 0">4 אמריקאיות + שאלה פתוחה אחת. מתאים ליום שני.</p></button>
  <button class="card" style="text-align:right;width:100%" onclick="startMock('full')"><h3>מלא · 90 דקות</h3><p class="sm mu" style="margin:4px 0 0">8 אמריקאיות + 2 פתוחות, בדיוק כמו המבחן. רק אם יש לך זמן.</p></button></div>
  ${S.mocks.length?`<div class="sec"><div class="lbl">ניסיונות קודמים</div><div class="card tight">${S.mocks.map(m=>`<div class="mrow row"><span>${m.kind==='full'?'מלא':'מקוצר'} · ${new Date(m.at).toLocaleDateString('he-IL')}</span><span class="sp"></span><b>${m.grade}</b></div>`).join('')}</div></div>`:''}`,'more')}
function startMock(kind){
  const nMc=kind==='full'?8:4,nOp=kind==='full'?2:1,mins=kind==='full'?90:25;
  const tps=['A','B','C','D'];let mc=[];for(let k=0;mc.length<nMc&&k<200;k++){const tp=tps[k%4];const pool=shuf(Q.filter(q=>q.tp===tp&&q.src==='n'&&q.t==='mc'&&!mc.includes(q)));const un=pool.find(q=>!S.ans[q.id])||pool[0];if(un)mc.push(un)}
  const opPool=shuf(OPEN.filter(o=>!(S.open[o.id]&&S.open[o.id].score!=null))).concat(shuf(OPEN));const ops=[];opPool.forEach(o=>{if(ops.length<nOp&&!ops.includes(o)&&!ops.some(x=>x.tp===o.tp))ops.push(o)});
  const end=Date.now()+mins*6e4;
  startRun('mock',shuf(mc),{title:kind==='full'?'מבחן דמה מלא':'מבחן דמה מקוצר',exam:true,timed:end,back:'mock',tab:'more',kindM:kind,ops,
    onEnd(){RUN.mockOpen=true;RUN.oi=0;mockOpenStep()}});
}
function mockOpenStep(){const R=RUN;if(R.oi>=R.ops.length)return mockEnd();const o=R.ops[R.oi];
  S.open[o.id]={text:''};save();openQ(o.id,true);
  $('#app').insertAdjacentHTML('afterbegin',`<div class="top"><h2 style="flex:1">${R.title}</h2><span class="timer" id="tmr"></span></div><p class="xs mu" style="margin:-8px 0 10px">שאלה פתוחה ${R.oi+1} מתוך ${R.ops.length}. כתוב, ואז "בדוק אותי".</p>`);tick()}
function mockNextOpen(){RUN.oi++;mockOpenStep()}
function mockEnd(){const R=RUN;const mcPts=R.ok*8,mcMax=R.qs.length*8;const opPts=R.ops.reduce((s,o)=>s+(S.open[o.id].score||0),0),opMax=R.ops.length*18;
  const grade=Math.round((mcPts+opPts)/(mcMax+opMax)*100);S.mocks.push({kind:R.kindM,at:Date.now(),grade});if(R.kindM==='mini')markGo('mock/mini');save();
  view(`${topBar('תוצאות המבחן','home')}<div class="card" style="text-align:center"><div class="xs mu">ציון משוער</div><div class="score">${grade}</div>
  <div class="mu sm" style="margin-top:8px">אמריקאיות: ${mcPts}/${mcMax} · פתוחות: ${opPts}/${opMax}</div></div>
  <div class="sec card tight">${R.res.map(r=>{const q=QBY(r.id);return `<div class="mrow sm"><span style="color:${r.ok?'var(--ok)':'var(--bad)'}">${r.ok?'✓':'✗'}</span> ${esc(q.q)}${r.ok?'':`<div class="xs" style="color:var(--ok);margin-top:4px">${esc(answerText(q))}</div>`}</div>`}).join('')}</div>
  <p class="sm mu">${grade>=85?'אתה מוכן. מחר בבוקר רק חזרה על טעויות.':grade>=65?'קרוב. עבור על הטעויות ועל הנקודות שחסרו בפתוחה.':'יש פערים. חזור לכרטיסים של הנושא החלש, ואז חזרה על טעויות.'}</p>
  <div class="sec"><button class="btn pri" onclick="go('home')">חזרה לתוכנית</button></div>`,'more')}
function tick(){const el=()=>$('#tmr');const f=()=>{if(!el()||!RUN||!RUN.timed)return;let s=Math.max(0,Math.round((RUN.timed-Date.now())/1000));el().textContent=`⏱ ${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;el().classList.toggle('low',s<300)};f();clearInterval(timerInt);timerInt=setInterval(f,1000)}

/* ===== טעויות / חובה לזכור / עוד ===== */
function wrongRun(){const qs=S.wrong.map(QBY).filter(Boolean);
  if(!qs.length){markGo('wrong');return view(`${topBar('חזרה על טעויות','home')}<div class="card" style="text-align:center"><div style="font-size:40px">✓</div><h3>אין טעויות פתוחות</h3><p class="mu sm">כל שאלה שתטעה בה תופיע כאן, ותצא מכאן כשתענה עליה נכון.</p></div><div class="sec"><button class="btn pri" onclick="go('practice/ALL')">סבב מעורב</button></div>`,'practice')}
  startRun('wrong',shuf(qs).slice(0,15),{title:'חזרה על טעויות',go:'wrong',back:'home',again:'wrong'})}
function sheet(){markGo('sheet');
  const keys=['A','B','C','D'].map(tp=>`<div class="sec"><div class="lbl">${TOPICS[tp].icon} ${TOPICS[tp].name}</div><div class="card tight">${CARDS[tp].map(c=>`<div class="mrow sm"><b>${c.t}:</b> ${c.k}</div>`).join('')}</div></div>`).join('');
  view(`${topBar('חובה לזכור','learn')}
  <div class="lbl" style="font-size:13px;color:var(--mu)">ציר זמן</div><div class="card tight tl">${TIMELINE.map(t=>`<div class="y">${t[0]}</div><div>${t[1]}</div>`).join('')}</div>
  <div class="sec"><div class="lbl">מספרים</div><div class="card tight tl">${NUMBERS.map(t=>`<div class="y">${t[0]}</div><div>${t[1]}</div>`).join('')}</div></div>
  ${keys}`,'learn')}
function more(){view(`<div class="top"><h2>עוד</h2></div><div class="stack">
  <button class="btn sec2" onclick="go('mock')">📝 מבחן דמה</button>
  <button class="btn sec2" onclick="go('wrong')">🔁 חזרה על טעויות (${S.wrong.length})</button>
  <button class="btn sec2" onclick="go('sheet')">📌 חובה לזכור</button>
  <button class="btn sec2" onclick="go('src')">📚 מקורות ובדיקת עובדות</button>
  <button class="btn ghost" onclick="resetAll()">איפוס כל ההתקדמות</button></div>
  <p class="xs mu" style="margin-top:16px">להתקנה כאפליקציה: בתפריט של הדפדפן ← "הוסף למסך הבית". ההתקדמות נשמרת בטלפון הזה בלבד.</p>`,'more')}
function src(){view(`${topBar('מקורות','more')}<div class="card tight sm">
  <p style="margin-top:0">העובדות בכלי נבדקו מול המקורות האלה. במקומות שבהם דף התרגול לא מדויק, כתוב את זה בהסבר של השאלה.</p>
  ${SOURCES.map(s=>`<div class="mrow"><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></div>`).join('')}</div>
  <div class="sec card tight sm"><b>מה עדיין הנחה:</b> המשקל של כל נושא במבחן (המורה לא פירטה), והתשובות לשאלות מהדף שהמורה לא פתרה (נבחרו לפי החומר).</div>`,'more')}
function resetAll(){if(confirm('למחוק את כל ההתקדמות?')){localStorage.removeItem(KEY);load();go('home');route()}}

/* ===== ניתוב ===== */
function route(){
  const h=(location.hash||'#home').slice(1).split('/');const [a,b,c]=h;
  if(a==='home'||!a)return home();
  if(a==='learn')return b?learn(b,+c||0):learnList();
  if(a==='practice'){if(!b)return practiceList();const tps=b==='ALL'?['A','B','C','D']:b.split('');
    return startRun('practice',pickPractice(tps,12),{title:b==='ALL'?'סבב מעורב':tps.map(t=>TOPICS[t].name).join(' + '),go:'practice/'+b,again:'practice/'+b})}
  if(a==='open')return b?openQ(b):openList();
  if(a==='diag')return diag();
  if(a==='wrong')return wrongRun();
  if(a==='mock')return b==='mini'?startMock('mini'):b==='full'?startMock('full'):mockMenu();
  if(a==='sheet')return sheet();
  if(a==='more')return more();
  if(a==='src')return src();
  home();
}
window.addEventListener('hashchange',route);
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.t)));
route();
setInterval(()=>{if((location.hash||'#home')==='#home')home()},60000);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
